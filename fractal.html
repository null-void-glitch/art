<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDF Fractal — black &amp; white dithered</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #err {
    position: fixed; left: 0; top: 0; right: 0;
    font: 13px/1.4 monospace; color: #f66; background: #200;
    padding: 8px 12px; white-space: pre-wrap; display: none;
  }
  #hint {
    position: fixed; left: 8px; bottom: 8px;
    font: 12px/1.4 monospace; color: #888; background: rgba(255,255,255,.7);
    padding: 4px 8px; pointer-events: none;
  }
  #readout {
    position: fixed; right: 8px; top: 8px;
    font: 12px/1.5 monospace; color: #444; background: rgba(255,255,255,.7);
    padding: 4px 8px; pointer-events: none; white-space: pre;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<pre id="err"></pre>
<div id="hint">drag = orbit · scroll = zoom · ←→ = angle A · ↑↓ = angle B · [ ] = detail · , . = contrast · shift = coarse · R = reset · S = save PNG</div>
<div id="readout"></div>

<!-- =====================================================================
     This is a STILL-image tool, not a flythrough. Drag to frame a
     composition you like, scroll to zoom, press S to save a PNG.

     Pipeline (read the 4 numbered sections below):
       1. The fractal as a distance estimator (kaleidoscopic IFS)
       2. Raymarch + normal + ambient occlusion
       3. Shading: AO + rim light -> a single grey value
       4. Post: crush to 1-bit black & white via Bayer ordered dither
====================================================================== -->
<script id="frag" type="x-shader/x-fragment">
precision highp float;

uniform vec2  uResolution;
uniform vec3  uCamPos;     // camera position (set by mouse)
uniform float uContrast;
uniform float uAngleA;     // KIFS pre-fold rotation  (left/right arrows)
uniform float uAngleB;     // KIFS post-fold rotation (up/down arrows)
uniform int   uIter;       // fold count / solidity   ([ and ] keys)

// ---------------------------------------------------------------------
// 1. THE FRACTAL  — a KALEIDOSCOPIC IFS (KIFS).
// Each fold: ROTATE the point, MIRROR it into the positive octant (abs),
// SORT its components across the diagonals (the "kaleidoscope"), ROTATE
// again, then SCALE toward a corner. Because every step is a rotation,
// reflection, or uniform scale, distance is just length(z) shrunk by the
// total scaling -> length(z) * scale^(-ITER). The two ROTATION ANGLES are
// the expressive controls: tiny changes swing it from soft to razor shards.
//
// Tweak these to explore:
#define MAX_ITER 24        // hard cap; live count comes from uIter ([ and ])
#define SCALE    1.9       // must be > 1. try 1.5 ... 2.4
#define OFFSET   vec3(1.0, 1.0, 1.0)   // corner pulled toward each step
// ANGLE_A / ANGLE_B / ITER are uniforms now, driven live by the keyboard.
// (GLSL needs a constant loop bound, so we loop to MAX_ITER and break early.)
// ---------------------------------------------------------------------
mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }

float DE(vec3 z) {
    for (int i = 0; i < MAX_ITER; i++) {
        if (i >= uIter) break;                    // stop at the live fold count
        z.xy = rot(uAngleA) * z.xy;               // pre-rotate
        z = abs(z);                               // mirror into +octant
        if (z.x < z.y) z.xy = z.yx;               // sort -> kaleidoscope folds
        if (z.x < z.z) z.xz = z.zx;
        if (z.y < z.z) z.yz = z.zy;
        z.yz = rot(uAngleB) * z.yz;               // post-rotate
        z = z * SCALE - OFFSET * (SCALE - 1.0);   // scale toward the corner
    }
    return length(z) * pow(SCALE, -float(uIter));
}

// ---------------------------------------------------------------------
// 2. RAYMARCH + helpers.
// Because DE() returns a true distance estimate, we can step by exactly
// that amount each time (classic sphere tracing).
// ---------------------------------------------------------------------
float raymarch(vec3 ro, vec3 rd, out vec3 hitPos) {
    float t = 0.0;
    for (int i = 0; i < 160; i++) {
        vec3 p = ro + rd * t;
        float d = DE(p);
        if (d < 0.0006 * t) { hitPos = p; return t; }
        t += d * 0.9;                 // 0.9 = slight safety margin
        if (t > 30.0) break;
    }
    return -1.0;
}

vec3 calcNormal(vec3 p) {
    vec2 e = vec2(0.0008, 0.0);
    return normalize(vec3(
        DE(p + e.xyy) - DE(p - e.xyy),
        DE(p + e.yxy) - DE(p - e.yxy),
        DE(p + e.yyx) - DE(p - e.yyx)
    ));
}

// Ambient occlusion: sample the field just off the surface; if stuff is
// nearby, this point sits in a crevice -> darken it. This creates almost
// all the sense of depth in the dark areas.
float calcAO(vec3 p, vec3 n) {
    float occ = 0.0, sca = 1.0;
    for (int i = 0; i < 5; i++) {
        float h = 0.01 + 0.15 * float(i) / 4.0;
        occ += (h - DE(p + n * h)) * sca;
        sca *= 0.9;
    }
    return clamp(1.0 - 2.5 * occ, 0.0, 1.0);
}

// ---------------------------------------------------------------------
// 4. DITHER  — recursive Bayer ordered-dither (gives the dot-grid texture).
// Bayer2 is the 2x2 base; the macros build it up to an 8x8 threshold map.
// ---------------------------------------------------------------------
float Bayer2(vec2 a) { a = floor(a); return fract(a.x * 0.5 + a.y * a.y * 0.75); }
#define Bayer4(a) (Bayer2(0.5*(a))*0.25 + Bayer2(a))
#define Bayer8(a) (Bayer4(0.5*(a))*0.25 + Bayer2(a))

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution.xy) / uResolution.y;

    // Camera always looks at the origin (the heart of the fractal).
    vec3 ro = uCamPos;
    vec3 fwd = normalize(-ro);
    vec3 right = normalize(cross(vec3(0.0, 1.0, 0.0), fwd));
    vec3 up = cross(fwd, right);
    vec3 rd = normalize(uv.x * right + uv.y * up + 1.4 * fwd);  // 1.4 = lens

    // --- 3. SHADING -> a single brightness value `lum` in [0,1] ---
    float lum;
    vec3 p;
    float t = raymarch(ro, rd, p);
    if (t < 0.0) {
        lum = 0.95;                                   // background = near white
    } else {
        vec3 n = calcNormal(p);
        vec3 light = normalize(vec3(0.6, 0.8, 0.4));
        float dif = clamp(dot(n, light), 0.0, 1.0);   // key light
        float ao  = calcAO(p, n);                     // crevice darkening
        float rim = pow(1.0 - clamp(dot(n, -rd), 0.0, 1.0), 2.5); // bright edges

        lum = (0.06 + 0.32 * dif) * ao;               // dark body (reads black)
        lum += 0.8 * rim;                             // white shard edges
        lum = mix(lum, 0.95, 1.0 - exp(-0.04 * t));   // distance -> white
    }

    // Contrast push (S-curve around mid-grey), then 1-bit ordered dither.
    lum = clamp((lum - 0.5) * uContrast + 0.5, 0.0, 1.0);
    float threshold = Bayer8(gl_FragCoord.xy);
    float bw = step(threshold, lum);                  // -> exactly 0.0 or 1.0

    gl_FragColor = vec4(vec3(bw), 1.0);
}
</script>

<!-- ===================== PLUMBING ===================== -->
<script>
const canvas = document.getElementById('c');
// preserveDrawingBuffer:true is required so "save PNG" can read the pixels.
const gl = canvas.getContext('webgl', { preserveDrawingBuffer: true });
const errBox = document.getElementById('err');
function fail(m){ errBox.style.display='block'; errBox.textContent = m; }
if (!gl) fail('WebGL not available.');

const vsSrc = `attribute vec2 a; void main(){ gl_Position = vec4(a,0.0,1.0); }`;
const fsSrc = document.getElementById('frag').textContent;
function compile(type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) fail('Shader error:\n'+gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsSrc));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsSrc));
gl.linkProgram(prog); gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'a');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

const uRes      = gl.getUniformLocation(prog, 'uResolution');
const uCamPos   = gl.getUniformLocation(prog, 'uCamPos');
const uContrast = gl.getUniformLocation(prog, 'uContrast');
const uAngleA   = gl.getUniformLocation(prog, 'uAngleA');
const uAngleB   = gl.getUniformLocation(prog, 'uAngleB');
const uIter     = gl.getUniformLocation(prog, 'uIter');

// KIFS controls. Home base = solid symmetric form; scrub UP from here.
let angleA = 0.0, angleB = 0.0, iter = 10;
let contrast = 2.2;                       // black-vs-white harshness (, and .)

// --- camera state, driven by the mouse ---
let yaw = 0.6, pitch = 0.3, dist = 3.5;
let dragging = false, lx = 0, ly = 0;
canvas.addEventListener('mousedown', e => { dragging = true; lx = e.clientX; ly = e.clientY; });
window.addEventListener('mouseup',   () => dragging = false);
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  yaw   += (e.clientX - lx) * 0.01;
  pitch += (e.clientY - ly) * 0.01;
  pitch = Math.max(-1.5, Math.min(1.5, pitch));
  lx = e.clientX; ly = e.clientY; render();
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  dist *= (1 + e.deltaY * 0.001);
  dist = Math.max(0.3, Math.min(20, dist));
  render();
}, { passive: false });

// Arrow keys scrub the fold angles; Shift = coarse steps. S = save PNG.
window.addEventListener('keydown', e => {
  const step = e.shiftKey ? 0.15 : 0.03;
  if      (e.key === 'ArrowLeft')  { angleA -= step; e.preventDefault(); }
  else if (e.key === 'ArrowRight') { angleA += step; e.preventDefault(); }
  else if (e.key === 'ArrowDown')  { angleB -= step; e.preventDefault(); }
  else if (e.key === 'ArrowUp')    { angleB += step; e.preventDefault(); }
  else if (e.key === '[') { iter = Math.max(3,  iter - 1); e.preventDefault(); }
  else if (e.key === ']') { iter = Math.min(24, iter + 1); e.preventDefault(); }
  else if (e.key === ',') { contrast = Math.max(0.5, contrast - 0.1); e.preventDefault(); }
  else if (e.key === '.') { contrast = Math.min(6.0, contrast + 0.1); e.preventDefault(); }
  else if (e.key === 'r' || e.key === 'R') {        // back to solid home base
    angleA = 0.0; angleB = 0.0; iter = 10; contrast = 2.2;
    yaw = 0.6; pitch = 0.3; dist = 3.5;
    e.preventDefault();
  }
  else if (e.key === 's' || e.key === 'S') {
    const a = document.createElement('a');
    a.download = 'fractal.png';
    a.href = canvas.toDataURL('image/png');
    a.click();
    return;
  } else { return; }
  render();
});

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width  = canvas.clientWidth  * dpr;
  canvas.height = canvas.clientHeight * dpr;
  gl.viewport(0, 0, canvas.width, canvas.height);
  render();
}
window.addEventListener('resize', resize);

function render(){
  const cp = pitch, cy = yaw;
  const camPos = [
    dist * Math.cos(cp) * Math.sin(cy),
    dist * Math.sin(cp),
    dist * Math.cos(cp) * Math.cos(cy),
  ];
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform3f(uCamPos, camPos[0], camPos[1], camPos[2]);
  gl.uniform1f(uContrast, contrast);
  gl.uniform1f(uAngleA, angleA);
  gl.uniform1f(uAngleB, angleB);
  gl.uniform1i(uIter, iter);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  document.getElementById('readout').textContent =
    `angleA   ${angleA.toFixed(3)}\nangleB   ${angleB.toFixed(3)}\niter     ${iter}\ncontrast ${contrast.toFixed(1)}\ndist     ${dist.toFixed(2)}`;
}
resize();   // first draw (this is a still image; we only redraw on input)
</script>
</body>
</html>
