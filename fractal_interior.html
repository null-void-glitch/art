<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDF Fractal — Mandelbox interior (free-fly)</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #err {
    position: fixed; left: 0; top: 0; right: 0;
    font: 13px/1.4 monospace; color: #f66; background: #200;
    padding: 8px 12px; white-space: pre-wrap; display: none;
  }
  #hint {
    position: fixed; left: 8px; bottom: 8px;
    font: 12px/1.4 monospace; color: #888; background: rgba(255,255,255,.7);
    padding: 4px 8px; pointer-events: none;
  }
  #readout {
    position: fixed; right: 8px; top: 8px;
    font: 12px/1.5 monospace; color: #444; background: rgba(255,255,255,.7);
    padding: 4px 8px; pointer-events: none; white-space: pre;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<pre id="err"></pre>
<div id="hint">drag = look · W/A/S/D = move · E/Q = up/down · scroll = speed · [ ] = detail · , . = contrast · - = = shape · N M = singe/erode · R = reset · P = save PNG</div>
<div id="readout"></div>

<!-- =====================================================================
     FREE-FLY Mandelbox. The whole point of this file: the camera can move
     INTO the structure, so you see planes and shards receding front-to-back.
     Fly forward (W) from the start position straight into the fractal.
====================================================================== -->
<script id="frag" type="x-shader/x-fragment">
precision highp float;

uniform vec2  uResolution;
uniform vec3  uCamPos;      // where the camera is (free-fly)
uniform vec3  uCamDir;      // where it looks (normalised forward)
uniform float uContrast;
uniform float uScale;       // Mandelbox scale — the big shape knob (- and =)
uniform int   uIter;        // fold count / detail ([ and ])
uniform float uWarp;        // noise erosion — the "singe" knob (N and M)

// 3D value noise + fbm: the non-self-similar grit that folding can't make.
float hash3(vec3 p){ p = fract(p*0.3183099 + 0.1); p *= 17.0;
    return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float noise3(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f);
    return mix(mix(mix(hash3(i+vec3(0,0,0)),hash3(i+vec3(1,0,0)),f.x),
                   mix(hash3(i+vec3(0,1,0)),hash3(i+vec3(1,1,0)),f.x),f.y),
               mix(mix(hash3(i+vec3(0,0,1)),hash3(i+vec3(1,0,1)),f.x),
                   mix(hash3(i+vec3(0,1,1)),hash3(i+vec3(1,1,1)),f.x),f.y),f.z); }
float fbm3(vec3 p){ float s=0.0, a=0.5;
    for(int i=0;i<3;i++){ s+=a*noise3(p); p*=2.13; a*=0.5; } return s; }

// ---------------------------------------------------------------------
// 1. MANDELBOX distance estimator.
// box-fold (reflect back inside a cube) then sphere-fold (invert if inside
// an inner sphere) then scale+translate. Negative uScale gives the
// architectural, broken-corridor interior we want to fly through.
// ---------------------------------------------------------------------
#define MAX_ITER 18
#define MINR2    0.25
#define FIXEDR2  1.0

float DE(vec3 p) {
    vec3 z = p;
    float dr = 1.0;
    for (int i = 0; i < MAX_ITER; i++) {
        if (i >= uIter) break;
        z = clamp(z, -1.0, 1.0) * 2.0 - z;            // box fold
        float r2 = dot(z, z);                         // sphere fold:
        if (r2 < MINR2)      { float t = FIXEDR2 / MINR2; z *= t; dr *= t; }
        else if (r2 < FIXEDR2) { float t = FIXEDR2 / r2;  z *= t; dr *= t; }
        z = z * uScale + p;                            // scale & translate
        dr = dr * abs(uScale) + 1.0;
    }
    float d = length(z) / abs(dr);
    if (uWarp > 0.0) d -= uWarp * (fbm3(p * 4.0) - 0.5);  // erode the smooth surface
    return d;
}

vec3 calcNormal(vec3 p) {
    vec2 e = vec2(0.0008, 0.0);
    return normalize(vec3(
        DE(p + e.xyy) - DE(p - e.xyy),
        DE(p + e.yxy) - DE(p - e.yxy),
        DE(p + e.yyx) - DE(p - e.yyx)
    ));
}

float calcAO(vec3 p, vec3 n) {
    float occ = 0.0, sca = 1.0;
    for (int i = 0; i < 5; i++) {
        float h = 0.01 + 0.15 * float(i) / 4.0;
        occ += (h - DE(p + n * h)) * sca;
        sca *= 0.9;
    }
    return clamp(1.0 - 2.5 * occ, 0.0, 1.0);
}

float Bayer2(vec2 a) { a = floor(a); return fract(a.x * 0.5 + a.y * a.y * 0.75); }
#define Bayer4(a) (Bayer2(0.5*(a))*0.25 + Bayer2(a))
#define Bayer8(a) (Bayer4(0.5*(a))*0.25 + Bayer2(a))

void main() {
    vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution.xy) / uResolution.y;

    // Free-fly camera: position and forward both come from the keyboard/mouse.
    vec3 ro = uCamPos;
    vec3 fwd = uCamDir;
    vec3 right = normalize(cross(vec3(0.0, 1.0, 0.0), fwd));
    vec3 up = cross(fwd, right);
    vec3 rd = normalize(uv.x * right + uv.y * up + 1.4 * fwd);

    // March. Steps stay small near surfaces, so corridors resolve cleanly.
    float t = 0.0, lum = 0.92;     // background = near white
    for (int i = 0; i < 200; i++) {
        vec3 p = ro + rd * t;
        float d = DE(p);
        if (d < 0.0004 * t) {
            vec3 n = calcNormal(p);
            vec3 light = normalize(vec3(0.5, 0.8, -0.3));
            float dif = clamp(dot(n, light), 0.0, 1.0);
            float ao  = calcAO(p, n);
            float rim = pow(1.0 - clamp(dot(n, -rd), 0.0, 1.0), 2.5);
            lum  = (0.05 + 0.32 * dif) * ao;          // dark body
            lum += 0.8 * rim;                         // white edges
            lum  = mix(lum, 0.92, 1.0 - exp(-0.05 * t)); // depth -> white
            break;
        }
        t += d * (uWarp > 0.0 ? 0.5 : 0.85);   // smaller steps when noise is on
        if (t > 40.0) break;
    }

    lum = clamp((lum - 0.5) * uContrast + 0.5, 0.0, 1.0);
    float bw = step(Bayer8(gl_FragCoord.xy), lum);
    gl_FragColor = vec4(vec3(bw), 1.0);
}
</script>

<!-- ===================== PLUMBING ===================== -->
<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { preserveDrawingBuffer: true });
const errBox = document.getElementById('err');
function fail(m){ errBox.style.display='block'; errBox.textContent = m; }
if (!gl) fail('WebGL not available.');

const vsSrc = `attribute vec2 a; void main(){ gl_Position = vec4(a,0.0,1.0); }`;
const fsSrc = document.getElementById('frag').textContent;
function compile(type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) fail('Shader error:\n'+gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsSrc));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsSrc));
gl.linkProgram(prog); gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'a');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

const U = n => gl.getUniformLocation(prog, n);
const uRes=U('uResolution'), uPos=U('uCamPos'), uDir=U('uCamDir'),
      uContrast=U('uContrast'), uScale=U('uScale'), uIter=U('uIter'), uWarp=U('uWarp');

// --- free-fly camera state ---
const DEF = () => ({ pos:[0,0,-6], yaw:0, pitch:0, speed:0.3,
                     scale:-2.0, iter:12, contrast:2.2, warp:0.0 });
let s = DEF();

function forward(){ // unit vector the camera looks along
  return [ Math.cos(s.pitch)*Math.sin(s.yaw),
           Math.sin(s.pitch),
           Math.cos(s.pitch)*Math.cos(s.yaw) ];
}
function rightVec(f){ // horizontal strafe axis
  const r=[ f[2], 0, -f[0] ], L=Math.hypot(r[0],r[2])||1;
  return [r[0]/L, 0, r[2]/L];
}

// drag to look around
let dragging=false, lx=0, ly=0;
canvas.addEventListener('mousedown', e=>{ dragging=true; lx=e.clientX; ly=e.clientY; });
window.addEventListener('mouseup', ()=> dragging=false);
window.addEventListener('mousemove', e=>{
  if(!dragging) return;
  s.yaw   -= (e.clientX-lx)*0.005;
  s.pitch -= (e.clientY-ly)*0.005;
  s.pitch = Math.max(-1.5, Math.min(1.5, s.pitch));
  lx=e.clientX; ly=e.clientY; render();
});
// scroll = movement speed (how far each W/S step travels)
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  s.speed *= (1 - e.deltaY*0.001);
  s.speed = Math.max(0.005, Math.min(2.0, s.speed));
  render();
}, {passive:false});

window.addEventListener('keydown', e=>{
  const f = forward(), r = rightVec(f);
  const mv = (v,k)=>{ s.pos[0]+=v[0]*k; s.pos[1]+=v[1]*k; s.pos[2]+=v[2]*k; };
  const k = e.key.toLowerCase();
  if      (k==='w') mv(f,  s.speed);
  else if (k==='s') mv(f, -s.speed);
  else if (k==='d') mv(r,  s.speed);
  else if (k==='a') mv(r, -s.speed);
  else if (k==='e') s.pos[1] += s.speed;
  else if (k==='q') s.pos[1] -= s.speed;
  else if (k==='[') s.iter = Math.max(3, s.iter-1);
  else if (k===']') s.iter = Math.min(18, s.iter+1);
  else if (k===',') s.contrast = Math.max(0.5, s.contrast-0.1);
  else if (k==='.') s.contrast = Math.min(6.0, s.contrast+0.1);
  else if (k==='-') s.scale -= 0.05;
  else if (k==='=') s.scale += 0.05;
  else if (k==='n') s.warp = Math.max(0.0, s.warp - 0.01);
  else if (k==='m') s.warp = Math.min(0.5, s.warp + 0.01);
  else if (k==='r') s = DEF();
  else if (k==='p') {
    const a=document.createElement('a'); a.download='fractal_interior.png';
    a.href=canvas.toDataURL('image/png'); a.click(); return;
  } else return;
  e.preventDefault();
  render();
});

function resize(){
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  canvas.width = canvas.clientWidth*dpr; canvas.height = canvas.clientHeight*dpr;
  gl.viewport(0,0,canvas.width,canvas.height); render();
}
window.addEventListener('resize', resize);

function render(){
  const f = forward();
  gl.uniform2f(uRes, canvas.width, canvas.height);
  gl.uniform3f(uPos, s.pos[0], s.pos[1], s.pos[2]);
  gl.uniform3f(uDir, f[0], f[1], f[2]);
  gl.uniform1f(uContrast, s.contrast);
  gl.uniform1f(uScale, s.scale);
  gl.uniform1i(uIter, s.iter);
  gl.uniform1f(uWarp, s.warp);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  document.getElementById('readout').textContent =
    `pos   ${s.pos.map(v=>v.toFixed(2)).join(', ')}\n` +
    `scale ${s.scale.toFixed(2)}\niter  ${s.iter}\n` +
    `contr ${s.contrast.toFixed(1)}\nwarp  ${s.warp.toFixed(2)}\nspeed ${s.speed.toFixed(3)}`;
}
resize();
</script>
</body>
</html>
