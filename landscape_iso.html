<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Landscape iso-curves (contour map)</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #err { position: fixed; left:0; top:0; right:0; font:13px/1.4 monospace;
         color:#f66; background:#200; padding:8px 12px; white-space:pre-wrap; display:none; }
  #hint { position: fixed; left:8px; bottom:8px; font:12px/1.4 monospace;
          color:#888; background:rgba(255,255,255,.7); padding:4px 8px; pointer-events:none; }
  #readout { position: fixed; right:8px; top:8px; font:12px/1.5 monospace;
             color:#444; background:rgba(255,255,255,.7); padding:4px 8px;
             pointer-events:none; white-space:pre; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<pre id="err"></pre>
<div id="hint">drag = orbit · scroll = zoom · WASD = pan · [ ] = spacing · , . = line width · - = = height · &lt; &gt; = terrain scale · G = new terrain · D = dither · R = reset · P = save</div>
<div id="readout"></div>

<!-- =====================================================================
     ISO-CURVES OF A LANDSCAPE.
     We raymarch an fbm heightfield (a landscape), but instead of LIGHTING
     the hit point we draw a CONTOUR LINE wherever the elevation crosses a
     multiple of `spacing`. The magic is fwidth(): where the slope is steep
     (or grazing/far), elevation changes fast across a pixel, so many
     contours fall inside one pixel and merge into solid black. Flat ground
     -> lines spread out -> white. Density = steepness, exactly like a map.
====================================================================== -->
<script id="frag" type="x-shader/x-fragment">
#extension GL_OES_standard_derivatives : enable
precision highp float;

uniform vec2  uResolution;
uniform vec3  uEye, uTarget;
uniform float uSpacing, uLineW, uHeight, uTScale;
uniform vec2  uSeed;
uniform float uDither;

// --- noise / fbm -> the landscape ---
float hash(vec2 p){ p=fract(p*vec2(123.34,345.45)); p+=dot(p,p+34.345); return fract(p.x*p.y); }
float noise(vec2 p){
  vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),
             mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);
}
float fbm(vec2 p){ float s=0.0,a=0.5; for(int i=0;i<6;i++){ s+=a*noise(p); p*=2.0; a*=0.5; } return s; }
float terrain(vec2 xz){ return fbm(xz*uTScale + uSeed)*uHeight; }
float mapH(vec3 p){ return p.y - terrain(p.xz); }

float Bayer2(vec2 a){ a=floor(a); return fract(a.x*0.5 + a.y*a.y*0.75); }
#define Bayer4(a) (Bayer2(0.5*(a))*0.25 + Bayer2(a))
#define Bayer8(a) (Bayer4(0.5*(a))*0.25 + Bayer2(a))

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*uResolution.xy)/uResolution.y;
  vec3 ro = uEye;
  vec3 fwd = normalize(uTarget - ro);
  vec3 right = normalize(cross(vec3(0,1,0), fwd));
  vec3 up = cross(fwd, right);
  vec3 rd = normalize(uv.x*right + uv.y*up + 1.3*fwd);

  // raymarch the heightfield
  float t = 0.1, hit = -1.0;
  vec3 p;
  for(int i=0;i<320;i++){
    p = ro + rd*t;
    float d = mapH(p);
    if(d < 0.0025*t){ hit = t; break; }
    t += d*0.35;
    if(t > 320.0) break;
  }

  float tone = 1.0;                       // 1 = white paper
  if(hit > 0.0){
    float f = p.y / uSpacing;             // elevation in "contour units"
    float w = fwidth(f);                  // how many contours cross this pixel
    float dist = abs(fract(f - 0.5) - 0.5);
    float line = 1.0 - smoothstep(0.0, w*uLineW, dist);  // 1 on a line
    line *= exp(-0.005 * t);              // haze: distant lines fade to white
    tone = 1.0 - line;                    // black line on white
  }

  // optional 1-bit ordered dither (the dotted grain in his pieces)
  vec3 col = vec3(tone);
  if(uDither > 0.5) col = vec3(step(Bayer8(gl_FragCoord.xy), tone));
  gl_FragColor = vec4(col, 1.0);
}
</script>

<!-- ===================== PLUMBING ===================== -->
<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { preserveDrawingBuffer: true });
const errBox = document.getElementById('err');
function fail(m){ errBox.style.display='block'; errBox.textContent=m; }
if(!gl) fail('WebGL not available.');
gl.getExtension('OES_standard_derivatives');   // needed for fwidth()

const vsSrc = `attribute vec2 a; void main(){ gl_Position = vec4(a,0.0,1.0); }`;
const fsSrc = document.getElementById('frag').textContent;
function compile(type,src){
  const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) fail('Shader error:\n'+gl.getShaderInfoLog(s));
  return s;
}
const prog=gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, vsSrc));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, fsSrc));
gl.linkProgram(prog); gl.useProgram(prog);

const bufq=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,bufq);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
const loc=gl.getAttribLocation(prog,'a'); gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);

const U=n=>gl.getUniformLocation(prog,n);
const uRes=U('uResolution'),uEye=U('uEye'),uTarget=U('uTarget'),
      uSpacing=U('uSpacing'),uLineW=U('uLineW'),uHeight=U('uHeight'),
      uTScale=U('uTScale'),uSeed=U('uSeed'),uDither=U('uDither');

const DEF=()=>({ yaw:0.6, pitch:0.25, dist:16, tx:0, tz:0,
                 spacing:0.6, linew:1.2, height:7, tscale:0.12,
                 seed:[0,0], dither:1 });
let s=DEF();

let drag=false,lx=0,ly=0;
canvas.addEventListener('mousedown',e=>{drag=true;lx=e.clientX;ly=e.clientY;});
window.addEventListener('mouseup',()=>drag=false);
window.addEventListener('mousemove',e=>{
  if(!drag)return;
  s.yaw+=(e.clientX-lx)*0.01; s.pitch+=(e.clientY-ly)*0.01;
  s.pitch=Math.max(0.02,Math.min(1.4,s.pitch));
  lx=e.clientX;ly=e.clientY;render();
});
canvas.addEventListener('wheel',e=>{
  e.preventDefault(); s.dist*=(1+e.deltaY*0.001);
  s.dist=Math.max(2,Math.min(80,s.dist)); render();
},{passive:false});

window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  const fx=Math.sin(s.yaw), fz=Math.cos(s.yaw), pan=s.dist*0.05;
  if      (k==='w'){ s.tx+=fx*pan; s.tz+=fz*pan; }
  else if (k==='s'){ s.tx-=fx*pan; s.tz-=fz*pan; }
  else if (k==='d'){ s.tx+=fz*pan; s.tz-=fx*pan; }
  else if (k==='a'){ s.tx-=fz*pan; s.tz+=fx*pan; }
  else if (k==='[') s.spacing=Math.max(0.1, s.spacing-0.05);
  else if (k===']') s.spacing=Math.min(4.0, s.spacing+0.05);
  else if (e.key===',') s.linew=Math.max(0.3, s.linew-0.1);
  else if (e.key==='.') s.linew=Math.min(4.0, s.linew+0.1);
  else if (e.key==='<') s.tscale=Math.max(0.02, s.tscale-0.01);
  else if (e.key==='>') s.tscale=Math.min(0.5, s.tscale+0.01);
  else if (k==='-') s.height=Math.max(1, s.height-0.5);
  else if (k==='=') s.height=Math.min(30, s.height+0.5);
  else if (k==='g') s.seed=[Math.random()*100, Math.random()*100];
  else if (k==='d') s.dither = s.dither>0.5?0:1;
  else if (k==='r') s=DEF();
  else if (k==='p'){ const a=document.createElement('a');
    a.download='landscape_iso.png'; a.href=canvas.toDataURL('image/png'); a.click(); return; }
  else return;
  e.preventDefault(); render();
});

function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.width=canvas.clientWidth*dpr; canvas.height=canvas.clientHeight*dpr;
  gl.viewport(0,0,canvas.width,canvas.height); render();
}
window.addEventListener('resize',resize);

function render(){
  const tgt=[s.tx, s.height*0.4, s.tz];
  const eye=[ tgt[0]+s.dist*Math.cos(s.pitch)*Math.sin(s.yaw),
             tgt[1]+s.dist*Math.sin(s.pitch),
             tgt[2]+s.dist*Math.cos(s.pitch)*Math.cos(s.yaw) ];
  gl.uniform2f(uRes,canvas.width,canvas.height);
  gl.uniform3f(uEye,eye[0],eye[1],eye[2]);
  gl.uniform3f(uTarget,tgt[0],tgt[1],tgt[2]);
  gl.uniform1f(uSpacing,s.spacing);
  gl.uniform1f(uLineW,s.linew);
  gl.uniform1f(uHeight,s.height);
  gl.uniform1f(uTScale,s.tscale);
  gl.uniform2f(uSeed,s.seed[0],s.seed[1]);
  gl.uniform1f(uDither,s.dither);
  gl.drawArrays(gl.TRIANGLES,0,3);
  document.getElementById('readout').textContent =
    `spacing ${s.spacing.toFixed(2)}\nlineW   ${s.linew.toFixed(1)}\n`+
    `height  ${s.height.toFixed(1)}\ntscale  ${s.tscale.toFixed(2)}\n`+
    `dither  ${s.dither>0.5?'on':'off'}\ndist    ${s.dist.toFixed(1)}`;
}
resize();
</script>
</body>
</html>
