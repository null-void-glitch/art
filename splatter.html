<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Streak splatter — density point cloud</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #hint {
    position: fixed; left: 8px; bottom: 8px;
    font: 12px/1.4 monospace; color: #888; background: rgba(255,255,255,.7);
    padding: 4px 8px; pointer-events: none;
  }
  #readout {
    position: fixed; right: 8px; top: 8px;
    font: 12px/1.5 monospace; color: #444; background: rgba(255,255,255,.7);
    padding: 4px 8px; pointer-events: none; white-space: pre;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">drag = orbit · scroll = zoom · G = new cloud · , . = ink · [ ] = dot size · &lt; &gt; = flow scale · P = save PNG</div>
<div id="readout"></div>

<!-- A streak is built by dropping a seed point (in a density-weighted spot)
     and walking it through a smooth 3D flow field, emitting points as it
     goes. Many streaks => filament structures. No folding, no rounding. -->
<script id="vert" type="x-shader/x-vertex">
attribute vec3 pos;
uniform mat4 uMVP;
uniform float uPointSize;
varying float vDepth;
void main(){
  vec4 clip = uMVP * vec4(pos, 1.0);
  gl_Position = clip;
  gl_PointSize = uPointSize;
  vDepth = clip.w;          // view-space distance (bigger = farther)
}
</script>
<script id="frag" type="x-shader/x-fragment">
precision highp float;
varying float vDepth;
uniform float uInk;
void main(){
  // Lay down a little black ink; fade distant points toward the white paper
  // so depth reads. Accumulation across overlapping points builds density.
  float fade = clamp(exp(-0.12 * max(vDepth - 3.0, 0.0)), 0.04, 1.0);
  gl_FragColor = vec4(0.0, 0.0, 0.0, uInk * fade);
}
</script>

<script>
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl', { preserveDrawingBuffer: true, antialias: false });

function compile(type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER,   document.getElementById('vert').textContent));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById('frag').textContent));
gl.linkProgram(prog); gl.useProgram(prog);

const aPos = gl.getAttribLocation(prog, 'pos');
const uMVP = gl.getUniformLocation(prog, 'uMVP');
const uPointSize = gl.getUniformLocation(prog, 'uPointSize');
const uInk = gl.getUniformLocation(prog, 'uInk');
const buf = gl.createBuffer();

// ---------- 3D value noise (drives both density and flow direction) ----------
function hash3(i,j,k){
  let n = (i*374761393 + j*668265263 + k*1274126177) | 0;
  n = (n ^ (n >> 13)) * 1274126177 | 0;
  n = n ^ (n >> 16);
  return ((n >>> 0) / 4294967295);
}
function noise3(x,y,z){
  const xi=Math.floor(x), yi=Math.floor(y), zi=Math.floor(z);
  const xf=x-xi, yf=y-yi, zf=z-zi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf), w=zf*zf*(3-2*zf);
  const L=(a,b,t)=>a+(b-a)*t;
  return L(
    L(L(hash3(xi,yi,zi),   hash3(xi+1,yi,zi),   u),
      L(hash3(xi,yi+1,zi), hash3(xi+1,yi+1,zi), u), v),
    L(L(hash3(xi,yi,zi+1),   hash3(xi+1,yi,zi+1),   u),
      L(hash3(xi,yi+1,zi+1), hash3(xi+1,yi+1,zi+1), u), v),
    w);
}

// ---------- generate the streak cloud ----------
const STREAKS = 6000, PER = 70, STEP = 0.035, R = 3.0;
let count = 0;
function generate(){
  const data = new Float32Array(STREAKS * PER * 3);
  let o = 0;
  for(let s = 0; s < STREAKS; s++){
    // density-weighted seed: keep trying until we land in a dense spot
    let px, py, pz;
    for(let tries = 0; tries < 12; tries++){
      px = (Math.random()*2-1)*R;
      py = (Math.random()*2-1)*R;
      pz = (Math.random()*2-1)*R;
      const dens = noise3(px*flow*1.3 + 11, py*flow*1.3 + 7, pz*flow*1.3 + 3);
      if(dens*dens > Math.random()) break;     // squared -> sparser, clumpier
    }
    // walk the seed through the flow field, dropping points
    for(let j = 0; j < PER; j++){
      data[o++] = px; data[o++] = py; data[o++] = pz;
      const a = noise3(px*flow, py*flow, pz*flow) * 6.2832 * 2.0;       // yaw
      const b = noise3(px*flow+5.2, py*flow+1.3, pz*flow+8.7) * 3.1416; // pitch
      const sb = Math.sin(b);
      px += sb*Math.cos(a)*STEP;
      py += Math.cos(b)*STEP;
      pz += sb*Math.sin(a)*STEP;
    }
  }
  count = STREAKS * PER;
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
}

// ---------- mat4 helpers (column-major) ----------
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const norm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1; return [a[0]/l,a[1]/l,a[2]/l];};
function perspective(fovy, asp, n, f){
  const t = 1/Math.tan(fovy/2);
  return [t/asp,0,0,0, 0,t,0,0, 0,0,(f+n)/(n-f),-1, 0,0,2*f*n/(n-f),0];
}
function lookAt(eye, ctr, up){
  const z=norm(sub(eye,ctr)), x=norm(cross(up,z)), y=cross(z,x);
  return [x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0,
          -dot(x,eye),-dot(y,eye),-dot(z,eye),1];
}
function mul(a,b){
  const o=new Float32Array(16);
  for(let c=0;c<4;c++)for(let r=0;r<4;r++){
    let s=0; for(let k=0;k<4;k++) s+=a[k*4+r]*b[c*4+k];
    o[c*4+r]=s;
  }
  return o;
}

// ---------- state + controls ----------
let yaw=0.7, pitch=0.3, dist=8.0;
let ink=0.05, pointSize=1.5, flow=0.6;
let dragging=false, lx=0, ly=0;
canvas.addEventListener('mousedown', e=>{dragging=true; lx=e.clientX; ly=e.clientY;});
window.addEventListener('mouseup', ()=>dragging=false);
window.addEventListener('mousemove', e=>{
  if(!dragging) return;
  yaw += (e.clientX-lx)*0.01; pitch += (e.clientY-ly)*0.01;
  pitch = Math.max(-1.5, Math.min(1.5, pitch));
  lx=e.clientX; ly=e.clientY; render();
});
canvas.addEventListener('wheel', e=>{
  e.preventDefault();
  dist *= (1 + e.deltaY*0.001); dist = Math.max(1.0, Math.min(30, dist)); render();
}, {passive:false});
window.addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  if      (k==='g'){ generate(); }
  else if (k===',') ink = Math.max(0.005, ink-0.005);
  else if (k==='.') ink = Math.min(0.4, ink+0.005);
  else if (k==='[') pointSize = Math.max(1.0, pointSize-0.5);
  else if (k===']') pointSize = Math.min(6.0, pointSize+0.5);
  else if (e.key==='<') { flow = Math.max(0.1, flow-0.1); generate(); }
  else if (e.key==='>') { flow = Math.min(2.0, flow+0.1); generate(); }
  else if (k==='p'){
    const a=document.createElement('a'); a.download='splatter.png';
    a.href=canvas.toDataURL('image/png'); a.click(); return;
  } else return;
  e.preventDefault(); render();
});

function resize(){
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  canvas.width = canvas.clientWidth*dpr; canvas.height = canvas.clientHeight*dpr;
  gl.viewport(0,0,canvas.width,canvas.height); render();
}
window.addEventListener('resize', resize);

function render(){
  gl.clearColor(1,1,1,1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.disable(gl.DEPTH_TEST);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);   // ink over paper

  const eye = [ dist*Math.cos(pitch)*Math.sin(yaw),
                dist*Math.sin(pitch),
                dist*Math.cos(pitch)*Math.cos(yaw) ];
  const proj = perspective(1.1, canvas.width/canvas.height, 0.1, 100);
  const view = lookAt(eye, [0,0,0], [0,1,0]);
  const mvp = mul(proj, view);

  gl.uniformMatrix4fv(uMVP, false, mvp);
  gl.uniform1f(uPointSize, pointSize);
  gl.uniform1f(uInk, ink);

  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 0, 0);
  gl.drawArrays(gl.POINTS, 0, count);

  document.getElementById('readout').textContent =
    `points ${count}\nink    ${ink.toFixed(3)}\ndot    ${pointSize.toFixed(1)}\nflow   ${flow.toFixed(1)}\ndist   ${dist.toFixed(1)}`;
}

generate();
resize();
</script>
</body>
</html>
